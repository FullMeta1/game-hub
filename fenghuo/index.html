<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101e23">
  <meta name="description" content="烽火谋局：原创四人阵营策略卡牌。六名武将，十二种卡牌，与 AI 队友并肩出战。手机、电脑均可玩。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>烽火谋局 · Game Hub</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="engine.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a href="../" class="brand" aria-label="返回游戏库"><span class="seal" aria-hidden="true">烽</span><span>烽火谋局<small>FENGHUO · TACTICS</small></span></a>
      <nav aria-label="游戏工具">
        <button class="text-button" id="sound" aria-pressed="false">音效：关</button>
        <button class="text-button" id="rules">玩法</button>
        <button class="text-button" id="new-game">换将</button>
      </nav>
    </header>

    <main id="lobby">
      <section class="lobby-intro"><div class="eyebrow">四人明阵 · 单机对战</div><h1>点将，入局。</h1><p>你与一名友军，对阵两名敌将。<br>牌有攻守，局有进退。</p></section>
      <div class="selection-label"><span>选择你的武将</span><span class="muted">01 — 06</span></div>
      <div id="hero-grid" class="hero-grid" role="group" aria-label="选择武将"></div>
      <div class="lobby-bottom"><p id="record" class="muted"></p><div class="start-actions"><button id="resume" class="button secondary" hidden>继续上局</button><button id="start" class="button primary">以萧策出战 <span aria-hidden="true">↗</span></button></div></div>
      <p class="lobby-note">无需账号 · 自动保存 · 支持离线游玩</p>
    </main>

    <main id="battle" hidden>
      <section class="battle-meta" aria-label="对局状态"><div><span class="eyebrow">青锋 <span class="versus">VS</span> 赤霄</span><h1 id="round-text">第一轮</h1></div><div class="meta-right"><span id="deck-text"></span><button id="speed" class="chip">速度 ×1</button></div></section>
      <div class="battle-layout">
        <section class="table" aria-label="对战区域">
          <div class="opponent-row" id="opponents"></div>
          <div class="table-center"><div class="table-insignia" aria-hidden="true">局</div><div class="turn-pill" id="turn-pill"></div><p id="table-hint"></p></div>
          <div class="ally-row" id="allies"></div>
        </section>
        <aside class="journal"><div class="journal-title"><h2>战报</h2><span>LIVE</span></div><ol id="log" aria-label="最近战报"></ol><p class="journal-tip">留住一张闪避，往往比多打一张牌更重要。</p></aside>
      </div>
      <section class="hand-area" aria-label="你的手牌">
        <div class="hand-heading"><div><h2>你的手牌 <span id="hand-count"></span></h2><p id="hand-hint">点击卡牌，选择目标</p></div><button id="end-turn" class="button primary">结束回合</button></div>
        <div id="hand" class="hand" role="group" aria-label="手牌列表"></div>
        <div class="action-bar"><div id="selection-detail">请选择一张牌；闪避与濒死自救会自动处理。</div><div class="action-buttons"><button id="cancel" class="button secondary" hidden>取消</button><button id="skill" class="button secondary"></button><button id="play" class="button primary" disabled>选择手牌</button></div></div>
      </section>
      <div class="mobile-log"><button id="show-log" class="text-button">查看战报</button><span id="last-event"></span></div>
    </main>
    <footer><span>烽火谋局 <span class="muted">/ v1.0</span></span><button id="install-help" class="text-button">添加到主屏幕</button></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"><div class="modal-top"><span class="eyebrow" id="modal-eyebrow">烽火谋局</span><button id="close-modal" class="icon-button" aria-label="关闭弹窗">×</button></div><div id="modal-content"></div></dialog>
  <noscript>请开启 JavaScript 后游玩。此游戏无需登录、安装插件或支付。</noscript>
</body>
</html>
